name: Collect Telegram OSINT

on:
  schedule:
    - cron: "10,25,40,55 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-collector-${{ github.ref }}
  cancel-in-progress: false

jobs:
  telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Telegram client
        run: pip install "telethon==1.45.0"

      - name: Collect public Telegram posts
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: python telegram_collect.py

      - name: Commit Telegram queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source_queue.json
          if git diff --cached --quiet; then
            echo "No new Telegram sources."
            exit 0
          fi
          git commit -m "Collect Telegram OSINT sources"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main || git rebase --abort
          done
          echo "Unable to push Telegram queue after retries."
          exit 1
