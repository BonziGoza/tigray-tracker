<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tigray OSINT Tracker</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
body{margin:0;font:15px/1.45 system-ui,sans-serif;color:#1b1f24;background:#f2f4f6}
header{padding:12px 16px;background:#1b2733;color:#fff}header h1{margin:0;font-size:19px}header div{font-size:12px;opacity:.78}
main{display:grid;grid-template-columns:2fr 1fr;height:calc(100vh - 68px)}
#map{height:100%}#side{overflow:auto;background:#fff;border-left:1px solid #d5d9de;padding:10px}
.f{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.f button{border:1px solid #9aa4ae;background:#fff;border-radius:14px;padding:4px 10px;cursor:pointer}.f button.on{background:#1b2733;color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.stat{background:#f2f4f6;border-radius:8px;padding:7px;text-align:center}.stat b{display:block;font-size:18px}
.ev{border-top:1px solid #e3e6e9;padding:9px 0;cursor:pointer}.ev p{margin:3px 0}.src{font-size:12px;color:#5a6672}.src a{margin-right:7px}.article-row{padding:5px 7px;margin:5px 0;border-radius:7px;background:#f7f8fa;font-size:12px}.cred-strong{border-left:3px solid #1f7a3d}.cred-moderate{border-left:3px solid #b7791f}.cred-limited{border-left:3px solid #b42318}.cred-btn{font-size:12px}.why{display:none;margin-top:3px;color:#5a6672}.article-row.open .why{display:block}
.g{font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px;color:#fff;margin-right:6px}
.CONFIRMED{background:#1f7a3d}.STRONGLY-CORROBORATED{background:#18794e}.CORROBORATED{background:#2563a6}.REPORTED{background:#b7791f}.DEVELOPING{background:#9a6700}.CLAIM{background:#b42318}
.badge{font-size:11px;padding:2px 6px;border-radius:8px;background:#eef1f4;margin-left:4px}.early{background:#fff8e1;border:1px solid #f0d78c;border-radius:8px;padding:8px;margin-bottom:9px}.early b{display:block}
@media(max-width:760px){main{grid-template-columns:1fr;grid-template-rows:50vh auto;height:auto}}
</style></head>
<body>
<header><h1>Tigray OSINT Tracker</h1><div id="up">Loading…</div></header>
<main><div id="map"></div><div id="side">
<div class="stats" id="stats"></div>
<div class="f" id="gradeFilters"></div><div class="f" id="sourceFilters"></div><div id="list"></div>
</div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const COL={CONFIRMED:"#1f7a3d","STRONGLY CORROBORATED":"#18794e",CORROBORATED:"#2563a6",REPORTED:"#b7791f",DEVELOPING:"#9a6700",CLAIM:"#b42318"};
const map=L.map("map").setView([13,39.5],6);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:12,attribution:"© OpenStreetMap"}).addTo(map);
let events=[],gradeOn={CONFIRMED:1,"STRONGLY CORROBORATED":1,CORROBORATED:1,REPORTED:1,DEVELOPING:1,CLAIM:1},credOn={STRONG:1,MODERATE:1,LIMITED:1},layer=L.layerGroup().addTo(map),markers={};
let baseMapLayer=null;
const baseMapStyle={color:"#5b6470",weight:1.5,fillColor:"#9aa4ae",fillOpacity:.28,opacity:.95};
const baseMapPointStyle={radius:5,color:"#46515c",fillColor:"#fff",fillOpacity:.9,weight:1.5};
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function sourceLabel(s){if(s.platform==="reddit")return "Reddit";if(s.platform==="gdelt")return "GDELT";return s.outlet||"Source"}
function visible(e){return !!gradeOn[e.grade] && (e.sources||[]).some(s=>credOn[s.credibility_label||"LIMITED"])}
function addBaseMap(data){
  if(baseMapLayer){map.removeLayer(baseMapLayer);}
  baseMapLayer=L.geoJSON(data,{
    style:(feature)=>{
      const p=feature.properties||{};
      return {
        color:p.strokeColor||baseMapStyle.color,
        weight:Number(p.strokeWeight)||baseMapStyle.weight,
        opacity:p.strokeOpacity!=null?Number(p.strokeOpacity):baseMapStyle.opacity,
        fillColor:p.fillColor||baseMapStyle.fillColor,
        fillOpacity:p.fillOpacity!=null?Number(p.fillOpacity):baseMapStyle.fillOpacity
      };
    },
    pointToLayer:(feature,latlng)=>{
      const p=feature.properties||{};
      return L.circleMarker(latlng,{
        radius:Number(p.iconScale)||baseMapPointStyle.radius,
        color:p.strokeColor||baseMapPointStyle.color,
        fillColor:p.fillColor||baseMapPointStyle.fillColor,
        fillOpacity:p.fillOpacity!=null?Number(p.fillOpacity):baseMapPointStyle.fillOpacity,
        weight:Number(p.strokeWeight)||baseMapPointStyle.weight
      });
    },
    onEachFeature:(feature,layer)=>{
      const p=feature.properties||{};
      const title=p.name||p.folder||"Map feature";
      if(title||p.description){
        layer.bindPopup("<b>"+title+"</b>"+(p.description?"<br><small>"+p.description+"</small>":""));
      }
    }
  }).addTo(map);
  baseMapLayer.bringToBack();
  const bounds=baseMapLayer.getBounds();
  if(bounds.isValid()) map.fitBounds(bounds.pad(.08));
}
function draw(){
 layer.clearLayers();markers={};const list=document.getElementById("list");list.replaceChildren();
 events.filter(visible).forEach(e=>{
  if(e.lat!=null && e.lon!=null){const color=COL[e.grade]||"#555";const m=L.circleMarker([e.lat,e.lon],{radius:9,color,fillColor:color,fillOpacity:e.grade==="CLAIM"?.25:.8,dashArray:e.grade==="CONFIRMED"?null:"3 3"}).addTo(layer);
   m.bindPopup("<b>"+e.place+"</b><br>"+e.summary+"<br><small>"+(e.confidence??0)+"% evidence score</small>");markers[e.key]=m}
  const d=el("div","ev"),g=el("span","g "+e.grade.replaceAll(" ","-"),e.grade);
  const loc=e.place||e.region||"";
  const b=el("b","",loc ? (e.date+" · "+loc) : e.date);
  const score=el("span","badge",(e.confidence??0)+"%");
  const tier=el("span","badge",(e.source_tier||"D")+"-tier"+(e.best_source?" · "+e.best_source:""));
  d.append(g,b,score,tier,el("p","",e.summary));
  if(e.evidence_explanation){
    const why=el("div","src",e.evidence_explanation);
    why.style.marginTop="5px";
    d.append(why);
  }
  const translated=(e.translations||[]).map(x=>x.english_translation).filter(Boolean)[0];
  if(translated && translated!==e.summary){const t=el("p","",translated);t.style.marginTop="6px";t.style.fontWeight="600";d.append(t);}
  const s=el("div","src");
  (e.sources||[]).filter(x=>credOn[x.credibility_label||"LIMITED"]).slice(0,8).forEach(x=>{
    const row=el("div","article-row cred-"+String(x.credibility_label||"LIMITED").toLowerCase());
    const a=el("a","",sourceLabel(x));a.href=x.url;a.target="_blank";a.rel="noopener";
    const cs=el("span","badge",(x.credibility_score??0)+"/100 · "+(x.credibility_label||"LIMITED"));
    const headline=el("div","",x.title||"Open original article");
    headline.style.marginTop="3px";
    const why=el("div","why",x.credibility_explanation||"Score based on publisher profile and available article-level evidence.");
    row.append(a,cs,headline,why);
    row.onclick=(ev)=>{if(ev.target.tagName!=="A"){ev.stopPropagation();row.classList.toggle("open")}};
    s.append(row);
  });d.append(s);
  d.onclick=()=>{if(markers[e.key]&&e.lat!=null){map.setView([e.lat,e.lon],8);markers[e.key].openPopup()}};list.append(d);
 });
}
function button(parent,label,key,store){const b=el("button","on",label);b.onclick=()=>{store[key]=!store[key];b.classList.toggle("on");draw()};parent.append(b)}
function renderControls(){
 const gf=document.getElementById("gradeFilters");gf.replaceChildren();
 ["CONFIRMED","STRONGLY CORROBORATED","CORROBORATED","REPORTED","DEVELOPING","CLAIM"].forEach(k=>button(gf,k,k,gradeOn));
 const cf=document.getElementById("sourceFilters");cf.replaceChildren();
 cf.append(el("b","","Article credibility:"));
 ["STRONG","MODERATE","LIMITED"].forEach(k=>{const b=el("button","on cred-btn",k);b.onclick=()=>{credOn[k]=!credOn[k];b.classList.toggle("on");draw()};cf.append(b)});
}
function renderStats(){
 const stats=document.getElementById("stats");stats.replaceChildren();
 const total=events.length,early=events.filter(e=>["CLAIM","DEVELOPING"].includes(e.grade)).length;
 [[total,"EVENTS"],[early,"EARLY REPORTS"]].forEach(x=>{const d=el("div","stat");d.append(el("b","",String(x[0])),el("span","",x[1]));stats.append(d)});
}
Promise.all([
 fetch("data/base_map.geojson?"+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null),
 fetch("data/events.json?"+Date.now()).then(r=>r.json()),
 fetch("data/status.json?"+Date.now()).then(r=>r.ok?r.json():{})
 ]).then(([base,j,s])=>{
 if(base && base.features) addBaseMap(base);
 events=j.events||[];
 const checked=s.last_checked?new Date(s.last_checked).toLocaleString():"Waiting for first automatic check";
 const updated=j.updated?new Date(j.updated).toLocaleString():"Unknown";
 document.getElementById("up").innerHTML =
   `Last checked: <b>${checked}</b> · Event database updated: <b>${updated}</b><br><span style="opacity:.78">Map positions approximate · evidence grades are automated assessments, not guarantees</span>`;
 renderControls();
 renderStats();
 draw();
}).catch(()=>document.getElementById("up").textContent="Could not load tracker data");
</script></body></html>
